server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset files — cache forever (Vite fingerprints these names)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html — never cache so new deployments take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API + GraphQL proxy — api_gateway (YARP) owns routing to individual services from here;
    # see mealplanner/docs/plans/api-gateway-hybrid-plan.md for the full routing table.
    location /api/ {
        proxy_pass http://api_gateway:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /graphql {
        proxy_pass http://api_gateway:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — unknown paths serve index.html so the client router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }
}
