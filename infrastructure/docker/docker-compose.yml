
name: mealplanner
services:
  # postgres:
  #   image: postgres:17
  #   environment:
  #     POSTGRES_USER: mealplanner_user
  #     POSTGRES_PASSWORD: mealPlanner26!
  #     POSTGRES_DB: mealplannerdb
  #   volumes:
  #     - mealplanningdb_data:/var/lib/postgresql/data
  #     - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  identity_db:
    image: postgres:17
    container_name: identity_database_container
    environment:
      POSTGRES_USER: mealplanner_user
      POSTGRES_PASSWORD: mealPlanner26!
      POSTGRES_DB: identity_db
    volumes:
      - identitydb_data:/var/lib/postgresql/data
      - ../postgres/identity_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  meal_recipe_db:
    image: postgres:17
    container_name: meal_recipe_database_container
    environment:
      POSTGRES_USER: mealplanner_user
      POSTGRES_PASSWORD: mealPlanner26!
      POSTGRES_DB: mealrecipe_db
    volumes:
      - mealrecipedb_data:/var/lib/postgresql/data
      - ../postgres/meal_recipe_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  plan_db:
    image: postgres:17
    container_name: plan_database_container
    environment:
      POSTGRES_USER: mealplanner_user
      POSTGRES_PASSWORD: mealPlanner26!
      POSTGRES_DB: plan_db
    volumes:  
      - plandb_data:/var/lib/postgresql/data
      - ../postgres/plan_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5      
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mealplanner
      RABBITMQ_DEFAULT_PASS: mealplanner
    healthcheck:
      # Use rabbitmq-diagnostics to verify the broker is fully up and running
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s # Gi
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq    
  identity_service:
    build:
      context: ../..
      dockerfile: services/IdentityService/src/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      identity_db:
        condition: service_healthy
    environment:
      - ConnectionStrings__Identity=Host=identity_db;Port=5432;Database=identity_db;Username=mealplanner_user;Password=mealPlanner26!
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceApiKey=internal-service-key-replace-in-production
    ports:
      - "5002:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  meal_recipe_service:
    build:
      context: ../..
      dockerfile: services/MealRecipeService/src/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      meal_recipe_db:
        condition: service_healthy
    environment:
      - ConnectionStrings__MealRecipe=Host=meal_recipe_db;Port=5432;Database=mealrecipe_db;Username=mealplanner_user;Password=mealPlanner26!
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceApiKey=internal-service-key-replace-in-production
    ports:
      - "5003:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  plan_service:
    build:
      context: ../..
      dockerfile: services/PlanService/src/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      plan_db:
        condition: service_healthy
    environment:
      - ConnectionStrings__Postgres=Host=plan_db;Port=5432;Database=mealplannerdb;Username=mealplanner_user;Password=mealPlanner26!
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ServiceApiKey=internal-service-key-replace-in-production
    ports:
      - "5004:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      identity_service:
        condition: service_healthy
      meal_recipe_service:
        condition: service_healthy
      plan_service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # mealplanningdb_data:
  #   external: true
  identitydb_data:
    external: true
  mealrecipedb_data:
    external: true
  plandb_data:  
    external: true
  rabbitmq_data: