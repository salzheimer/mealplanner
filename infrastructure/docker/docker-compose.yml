  identity_db:
    image: postgres:17
    container_name: identity-database-container
    environment:
      POSTGRES_USER: mealplanner_user
      POSTGRES_PASSWORD: mealPlanner26!
      POSTGRES_DB: identitydb
    volumes:
      - identitydb_data:/var/lib/postgresql/data
      - ../postgres/identity_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  meal-recipe-db:
    image: postgres:17
    container_name: meal-recipe-database-container
    environment:
      POSTGRES_USER: mealplanner_user
      POSTGRES_PASSWORD: mealPlanner26!
      POSTGRES_DB: mealrecipe_db
    volumes:
      - mealrecipedb_data:/var/lib/postgresql/data
      - ../postgres/meal_recipe_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  plan-db:
    image: postgres:17
    container_name: plan-database-container
    environment:
      POSTGRES_USER: mealplanner_user
      POSTGRES_PASSWORD: mealPlanner26!
      POSTGRES_DB: plan_db
    volumes:  
      - plandb_data:/var/lib/postgresql/data
      - ../postgres/plan_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5      
